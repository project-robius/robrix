# Trigger CI on PR updates and main branch pushes
# Uses caching and selective path triggers to optimize performance

name: Robrix CI

# Only `main` branch
on:
    push:
      branches:
        - main
      ## PRs must be up to date to merge, so `main` only reruns these to refresh its caches.
      paths:
        - .cargo/**
        - .github/**
        - Cargo.lock
        - Cargo.toml
        - rust-toolchain.toml

    ## Keeps the caches current with new Rust releases, and covers merges that skipped CI.
    schedule:
      - cron: '0 8 * * *'

    pull_request:
      types: [opened, synchronize, reopened, ready_for_review]
      branches:
        - main
      paths:
        - packaging/**
        - resources/**
        - src/**
        - .cargo/**
        - build.rs
        - .github/**
        - Cargo.lock
        - Cargo.toml
        - rust-toolchain.toml

# Prevent concurrent CI runs and cancel in-progress runs on new pushes
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# Global environment configuration
env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"  # Disable incremental compilation in CI
    RUST_BACKTRACE: 1
    # Enable warnings as errors for strict checks
    RUSTFLAGS: "-D warnings"

jobs:
  clippy:
    if: github.event.pull_request.draft == false
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-rust-cache
      - run: cargo clippy --workspace --all-features --all-targets

  typos:
    if: github.event.pull_request.draft == false
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for typos
        uses: crate-ci/typos@v1.50.2
        with:
          config: .github/typos.toml
