# Trigger CI on PR updates, plus a nightly run on main
# Uses selective path triggers to optimize performance

name: Robrix CI

# Only `main` branch
on:
    ## Covers merges that skipped CI, and catches new lints in Rust releases.
    schedule:
      - cron: '0 8 * * *'

    pull_request:
      types: [opened, synchronize, reopened, ready_for_review]
      branches:
        - main
      paths:
        - packaging/**
        - resources/**
        - src/**
        - .cargo/**
        - build.rs
        - .github/**
        - Cargo.lock
        - Cargo.toml
        - rust-toolchain.toml

# Prevent concurrent CI runs and cancel in-progress runs on new pushes
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# Global environment configuration
env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"  # Disable incremental compilation in CI
    RUST_BACKTRACE: 1
    # Enable warnings as errors for strict checks
    RUSTFLAGS: "-D warnings"

jobs:
  clippy:
    if: github.event.pull_request.draft == false
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      ## Clippy never links, so makepad's wayland build script only needs these files to exist.
      - name: Stub out wayland's pkg-config files
        run: |
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          for lib in wayland-client wayland-egl; do
            printf 'Name: %s\nDescription: Stub for clippy\nVersion: 1.0\n' "$lib" > "$RUNNER_TEMP/pkgconfig/$lib.pc"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      ## No Rust cache here, since the build jobs need nearly all of the repo's 10 GB, and clippy beats the slowest build without one.
      - run: cargo clippy --workspace --all-features --all-targets
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/pkgconfig

  typos:
    if: github.event.pull_request.draft == false
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for typos
        uses: crate-ci/typos@v1.50.2
        with:
          config: .github/typos.toml
