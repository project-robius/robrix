# Third-party license notices
#
# Keeps licenses/THIRD-PARTY-NOTICES.html (full license texts) and
# licenses/THIRD-PARTY-LICENSES.md (summary) in sync with the dependency graph,
# without burdening contributors.
#
# Runs ONLY on pushes to main (after PRs merge). It regenerates both files with
# `cargo about` (config + templates in licenses/config/) and, if anything
# changed, commits them straight to main. The push needs LICENSES_PUSH_TOKEN, a
# PAT owned by a repo admin, since main's protection rejects GITHUB_TOKEN.
#
# This is intentionally NOT a check on contributor PRs: deps merge with briefly
# stale notices, then this workflow refreshes them right after.
#
# If a dependency uses a license not accepted in licenses/config/about.toml,
# `--fail` aborts the run before anything is pushed, so a new license type needs
# a human to vet it and add it there. You'll see this as a failed run on main.

name: Third-party licenses

on:
  push:
    branches:
      - main
    # Inputs only. The generated licenses/ files are deliberately absent here,
    # so this workflow's own push can't re-trigger it.
    paths:
      - Cargo.toml
      - Cargo.lock
      - licenses/config/about.toml
      - licenses/config/about.hbs
      - licenses/config/about.md.hbs
      - .github/workflows/licenses.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read   # LICENSES_PUSH_TOKEN does the writing, not GITHUB_TOKEN

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  licenses:
    name: Refresh third-party notices
    runs-on: ubuntu-latest
    steps:
      # A missing token would otherwise surface as an opaque 403 at the push,
      # ten minutes into the run.
      - name: Check push token
        env:
          TOKEN: ${{ secrets.LICENSES_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::LICENSES_PUSH_TOKEN is unset. It must hold a PAT owned by a repo admin, since main's protection rejects pushes from GITHUB_TOKEN."
            exit 1
          fi

      # ref: main so a workflow_dispatch from another branch still generates
      # main's notices. The token is what the push below authenticates with.
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.LICENSES_PUSH_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      # cargo-about is pinned to the version that generated the committed files;
      # a different version can render the output differently. When bumping this
      # pin, regenerate and commit both files in the same change.
      - name: Cache cargo-about
        id: cache-cargo-about
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.0-${{ runner.os }}

      - name: Install cargo-about
        if: steps.cache-cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.0 --features cli

      # Written outside the worktree so the push step can reset onto a moved main
      # without losing them.
      - name: Regenerate notices
        run: |
          cargo about generate --fail -c licenses/config/about.toml licenses/config/about.hbs    -o "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html"
          cargo about generate --fail -c licenses/config/about.toml licenses/config/about.md.hbs -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.md"

      # Each attempt rebuilds the commit on main's current tip, so the push is
      # always a plain fast-forward. Nobody can force-push main, not even an admin.
      - name: Commit and push to main
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html" licenses/THIRD-PARTY-NOTICES.html
            cp "$RUNNER_TEMP/THIRD-PARTY-LICENSES.md"  licenses/THIRD-PARTY-LICENSES.md
            git add -- licenses/THIRD-PARTY-NOTICES.html licenses/THIRD-PARTY-LICENSES.md
            if git diff --cached --quiet; then
              echo "Notices already match main, nothing to push."
              exit 0
            fi
            # This commit may never carry anything but the two generated notices,
            # no matter what staged them. Bail rather than push a surprise to main.
            stray=$(git diff --cached --name-only | grep -vxF -e licenses/THIRD-PARTY-NOTICES.html -e licenses/THIRD-PARTY-LICENSES.md || true)
            if [ -n "$stray" ]; then
              echo "::error::Refusing to push. Staged files outside the generated notices:"
              echo "$stray"
              exit 1
            fi
            git commit \
              -m "chore: update third-party license notices" \
              -m $'Regenerated by cargo-about from licenses/config/.\nDo not edit these files by hand.' \
              -m "Run: $RUN_URL"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt, retrying against the new tip."
          done
          echo "::error::Could not push after 3 attempts. Either main is unusually busy, or LICENSES_PUSH_TOKEN has expired or lost admin on this repo."
          exit 1
