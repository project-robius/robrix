# Robrix Build CI Workflow
# This workflow builds the Robrix project across multiple platforms including desktop and mobile.
# It includes 3 main hosts: macOS, Linux, and Windows for 5 targets: MacOS, Linux, Windows, IOS, and Android.

# Build Robrix Matrix Coverage:
# ┌─────────────────┬─────────────────┬─────────────────┐
# │   Host OS       │   Target        │   Build Tool    │
# ├─────────────────┼─────────────────┼─────────────────┤
# │ Ubuntu Latest   │ Linux x86_64    │ cargo build     │
# │ macOS 15 ARM64  │ macOS x86_64    │ cargo build     │
# │ macOS 15 ARM64  │ macOS ARM64     │ cargo build     │
# │ Windows 2022    │ Windows x86_64  │ cargo build     │
# │ macOS 15        │ iOS aarch64     │ cargo-makepad   │
# │ macOS 15        │ Android         │ cargo-makepad   │
# │ Ubuntu Latest   │ Android         │ cargo-makepad   │
# │ Ubuntu Latest   │ Android armv7   │ cargo-makepad   │
# │ Windows 2022    │ Android         │ cargo-makepad   │
# └─────────────────┴─────────────────┴─────────────────┘

name: Robrix Build CI

on:
  push:
    branches:
      - main
    ## PRs must be up to date to merge, so `main` only reruns these to refresh its caches.
    paths:
        - .github/**
        - .cargo/**
        - Cargo.lock
        - Cargo.toml
        - rust-toolchain.toml
  ## Keeps the caches current with new Rust releases, and covers merges that skipped CI.
  schedule:
    - cron: '0 8 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
        - packaging/**
        - resources/**
        - src/**
        - build.rs
        - .github/**
        - .cargo/**
        - Cargo.lock
        - Cargo.toml
        - rust-toolchain.toml
        # ignore files
        - '!**/*.md'
        - '!LICENSE-MIT'
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════
  # NATIVE DESKTOP BUILDS
  # These jobs build Robrix for desktop platforms using standard cargo build
  # ═══════════════════════════════════════════════════════════════════════════════════════
  build_ubuntu:
    name: Build Ubuntu
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/install-linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: ./.github/actions/setup-rust-cache

      - name: Build
        run: |
          cargo build --profile fast

      ## Using the `fast` profile lets this reuse all the deps from the build above.
      - name: Run unit tests
        run: |
          cargo test --profile fast --lib --locked

  build_macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Macs (M1/M2/M3/M4 chips)
          - arch: arm64
            target: aarch64-apple-darwin
          # Intel Macs (x86_64 architecture), cross-compiled since Intel runners are so much slower
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: ./.github/actions/setup-rust-cache
        with:
          key: ${{ matrix.arch }}

      - name: Build
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --profile fast --target ${{ matrix.target }}

  build_windows:
    name: Build Windows
    runs-on: windows-2022
    if: github.event.pull_request.draft == false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: ./.github/actions/setup-rust-cache

      - name: Build
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --profile fast

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # CROSS-PLATFORM MOBILE BUILDS
  # These jobs use cargo-makepad for mobile cross-compilation
  # ═══════════════════════════════════════════════════════════════════════════════════════

  build_ios_on_macos:
    name: Build iOS (macOS Host)
    runs-on: macos-15
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: ./.github/actions/setup-rust-cache

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install iOS toolchain
        run: |
          cargo makepad apple ios install-toolchain

      - name: Install bindgen-cli for aws-lc-sys cross-compilation
        run: |
          cargo install --locked bindgen-cli

      - name: Build for iOS targets
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_CMAKE_BUILDER: 1
        run: |
          # Install iOS targets
          rustup target add aarch64-apple-ios

          # Build the iOS simulator and device targets
          cargo makepad apple ios \
          --org=rs.robius \
          --app=robrix \
          build -p robrix \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  build_android_on_macos:
    name: Build Android (macOS Host)
    runs-on: macos-15
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: ./.github/actions/setup-rust-cache

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android install-toolchain --full-ndk

      - name: Build Android APK
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_CMAKE_BUILDER: 1
        run: |
          cargo makepad android build -p robrix \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  build_android_on_linux:
    name: Build Android (Linux Host)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: ./.github/actions/setup-rust-cache

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android install-toolchain --full-ndk

      - name: Build Android APK
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_CMAKE_BUILDER: 1
        run: |
          cargo makepad android build -p robrix \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  ## 32-bit ARM (armeabi-v7a), for devices whose Android userspace is 32-bit,
  ## e.g. those that report `armv8l`. The other Android jobs build arm64 only.
  build_android_armv7_on_linux:
    name: Build Android armv7 (Linux Host)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: ./.github/actions/setup-rust-cache

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android --abi=armv7 install-toolchain --full-ndk

      - name: Build Android APK
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_CMAKE_BUILDER: 1
        run: |
          cargo makepad android --abi=armv7 build -p robrix \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  build_android_on_windows:
    name: Build Android (Windows Host)
    runs-on: windows-2022
    if: github.event.pull_request.draft == false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: ./.github/actions/setup-rust-cache

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android install-toolchain --full-ndk

      - name: Build Android APK
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_CMAKE_BUILDER: 1
          CMAKE_GENERATOR: Ninja
        run: |
          ## Note: we can't use the profile here because cargo-makepad doesn't support custom profiles.
          # cargo makepad android build -p robrix --profile fast
          cargo makepad android build -p robrix \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  # Build Summary
  build_summary:
    name: Robrix Build Results Summary
    runs-on: ubuntu-latest
    needs: [
      build_ubuntu,
      build_macos,
      build_windows,
      build_ios_on_macos,
      build_android_on_macos,
      build_android_on_linux,
      build_android_armv7_on_linux,
      build_android_on_windows
    ]
    if: always()

    steps:
      - run: |
          echo "=== Desktop Builds ==="
          echo "Ubuntu: ${{ needs.build_ubuntu.result }}"
          echo "macOS: ${{ needs.build_macos.result }}"
          echo "Windows: ${{ needs.build_windows.result }}"
          echo "=== iOS Builds ==="
          echo "iOS (macOS): ${{ needs.build_ios_on_macos.result }}"
          echo "=== Android Builds ==="
          echo "Android (macOS): ${{ needs.build_android_on_macos.result }}"
          echo "Android (Linux): ${{ needs.build_android_on_linux.result }}"
          echo "Android armv7 (Linux): ${{ needs.build_android_armv7_on_linux.result }}"
          echo "Android (Windows): ${{ needs.build_android_on_windows.result }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
