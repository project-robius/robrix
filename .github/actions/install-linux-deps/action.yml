name: Install Linux dependencies
description: Install the system libraries that Robrix needs to build on Ubuntu.
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libssl-dev \
          libsqlite3-dev \
          pkg-config \
          llvm \
          clang \
          libclang-dev \
          binfmt-support \
          libxcursor-dev \
          libx11-dev \
          libasound2-dev \
          libpulse-dev \
          libwayland-dev libxkbcommon-dev
